name: Build wolfSSL native library

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/src/main/jni/Android.mk'
      - 'app/src/main/jni/Application.mk'
      - 'app/src/main/jni/user_settings.h'
      - 'app/src/main/jni/wolfssl_jni.c'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download NDK r16b
        run: |
          curl -L -o /tmp/ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r16b-linux-x86_64.zip
          unzip -q /tmp/ndk.zip -d /tmp/
          rm /tmp/ndk.zip

      - name: Clone wolfSSL v5.7.6-stable
        run: |
          git clone --depth 1 --branch v5.7.6-stable \
            https://github.com/wolfSSL/wolfssl.git \
            app/src/main/jni/wolfssl

      - name: Build with ndk-build
        run: |
          /tmp/android-ndk-r16b/ndk-build \
            NDK_PROJECT_PATH=app/src/main \
            NDK_APPLICATION_MK=app/src/main/jni/Application.mk \
            APP_BUILD_SCRIPT=app/src/main/jni/Android.mk \
            -j$(nproc)

      - name: Show output
        run: |
          find app/src/main/jni/libs -type f -name "*.so" | while read f; do
            echo "$f  $(ls -lh "$f" | awk '{print $5}')"
            file "$f"
          done

      - name: Upload libwolfssljni.so
        uses: actions/upload-artifact@v4
        with:
          name: libwolfssljni-armeabi
          path: app/src/main/jni/libs/armeabi/libwolfssljni.so
